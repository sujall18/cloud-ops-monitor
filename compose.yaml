services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  monitor:
    build:
      context: .
      dockerfile: Dockerfile.monitor
    ports:
      - "8000:8000"
    restart: unless-stopped
